<!DOCTYPE html>
<html>
<head>
    <title>Data Mahasiswa</title>
</head>
<body>
    <h1>Daftar Mahasiswa</h1>
    <a href="/tambah">+ Tambah Mahasiswa</a>
    <table border="1" cellpadding="8">
        <tr>
            <th>ID</th>
            <th>Nama</th>
            <th>NIM</th>
            <th>Jurusan</th>
            <th>Aksi</th>
        </tr>
        {% for m in mahasiswa %}
        <tr>
            <td>{{ m.id }}</td>
            <td>{{ m.nama }}</td>
            <td>{{ m.nim }}</td>
            <td>{{ m.jurusan }}</td>
            <td><a href="/hapus/{{ m.id }}">Hapus</a></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
